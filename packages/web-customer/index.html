<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/tagora-logo-2.png" />
    <title>Tagora Savings</title>
    <style>
      #tagora-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 9999;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }

      #tagora-preloader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #tagora-preloader .tagora-preloader-mark {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #tagora-preloader .tagora-preloader-mark::before {
        content: '';
        position: absolute;
        inset: -2px;
        border: 1.5px solid rgba(200, 154, 34, 0.18);
        border-top-color: rgba(200, 154, 34, 0.78);
        border-right-color: rgba(246, 222, 155, 0.65);
        border-radius: 50%;
        animation: tagora-spin 1.4s linear infinite;
      }

      #tagora-preloader img {
        width: 67px;
        height: auto;
        border-radius: 50%;
        filter: drop-shadow(0 2px 6px rgba(10,31,68,0.12));
        animation: tagora-pulse 1.6s ease-in-out infinite;
        transform-origin: center;
      }

      @keyframes tagora-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes tagora-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(0.97); }
      }
    </style>
    <script>
      window.addEventListener('load', function () {
        var preloader = document.getElementById('tagora-preloader');
        if (preloader) {
          preloader.classList.add('hidden');
          window.setTimeout(function () {
            preloader.remove();
          }, 420);
        }
      });
    </script>
  </head>
  <body>
    <div id="tagora-preloader" aria-hidden="true">
      <div class="tagora-preloader-mark">
        <img src="/tagora-preloader.png" alt="Loading Tagora" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
